[project]
name = "textcollate"
version = "0.1.0"
description = "Collate editions of a text, carry original page references between them, and typeset clean or side-by-side (translation) LaTeX"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Severin Gartland" }]
# Deliberately no third-party runtime dependencies: everything heavy is done by
# external tools (pdftotext, tesseract, pdfimages, lualatex) that `textcollate doctor` checks for.
dependencies = []

[project.scripts]
textcollate = "textcollate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textcollate"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
